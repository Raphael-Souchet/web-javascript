<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poke API</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/script.js" defer type="module"></script>
</head>
<body>
<h2>Sélectionner la génération de Pokémon et le tri :</h2>
<section>
    <div class="select">
        <select id="filtre">
            <option value="1" selected>Génération 1</option>
            <option value="2">Génération 2</option>
            <option value="3">Génération 3</option>
            <option value="4">Génération 4</option>
            <option value="5">Génération 5</option>
            <option value="6">Génération 6</option>
            <option value="7">Génération 7</option>
            <option value="8">Génération 8</option>
        </select>
        <select id="tri">
            <option value="id" selected>Trier par ID</option>
            <option value="nom">Trier par Nom</option>
            <option value="hp">Trier par Points de vie</option>
            <option value="attaque">Trier par Attaque</option>
            <option value="type">Trier par Type</option>
        </select>
    </div>
</section>
<section>
    <div id="boutons-types" class="boutons"></div>
</section>
<main></main>
</body>
</html>
